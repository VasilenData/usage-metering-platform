name: Ledger and product evidence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: meterline_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-disposable-only@localhost:5432/meterline_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --junitxml=tests.xml
      - run: python export_snapshot.py --verify
      - name: Verify dated evidence matches executed source
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          report = json.loads(Path('docs/release-2026-11-12.json').read_text())
          assert report['checks'] and all(row['passed'] for row in report['checks'])
          for name, expected in report['source_files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js && node --check web/sdk.js
      - run: node --test tests/test_sdk.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-test-evidence
          path: tests.xml
  publish-snapshot:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy read-only synthetic snapshot
        id: deployment
        uses: actions/deploy-pages@v4
