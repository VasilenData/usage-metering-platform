name: Ledger and product evidence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: meterline_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-disposable-only@localhost:5432/meterline_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --junitxml=tests.xml
      - name: Verify the local starter through real HTTP and independent SQL
        run: python -m starter.verify
      - run: python export_snapshot.py --verify
      - name: Reconcile a fresh multi-account workload
        run: python verify_workload.py --accounts 2 --originals 40 --output local-evidence/workload-ci.json
      - name: Select PostgreSQL 17 backup tools
        run: |
          if [ ! -x /usr/lib/postgresql/17/bin/pg_dump ]; then
            # Ubuntu's stock client may be older than the postgres:17 service.
            # Use PostgreSQL's signed repository and verify its published key.
            curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg.asc"
            test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg.asc" | awk -F: '$1=="fpr" {print $10; exit}')" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo install -m 644 "$RUNNER_TEMP/pgdg.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            . /etc/os-release
            printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y postgresql-client-17
          fi
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Repeat interruption and backup restoration on current source
        run: python verify_release.py --pg-bin /usr/lib/postgresql/17/bin --output local-evidence/release-ci.json
      - name: Fetch immutable pre-fix source for counterexample reproduction
        uses: actions/checkout@v4
        with:
          ref: 94a4cb1885297442ef59bdcf9fcecc605ff2a97b
          path: historical-source
      - name: Exercise real HTTP concurrency and malformed requests
        run: python verify_http.py --baseline-dir historical-source --output local-evidence/http-ci.json
      - name: Exercise restricted runtime and separate request allowances
        run: python verify_runtime.py --output local-evidence/runtime-ci.json
      - name: Restore current restricted runtime into a fresh database
        run: python verify_runtime_restore.py --pg-bin /usr/lib/postgresql/17/bin --output local-evidence/runtime-restore-ci.json
      - name: Fetch immutable pre-shared-quota source
        run: git fetch --no-tags origin d4a9d852ea2bfe7c28589daea9a5a946f07279bf
      - name: Exercise shared admission, response loss and sustained two-worker load
        run: python verify_multiworker.py --phase-seconds 10 --output local-evidence/multiworker-ci.json
      - name: Export immutable usage-to-finance source bundles through the restricted runtime
        run: python verify_finance_export.py --output local-evidence/finance-export-ci
      - name: Observe bounded database contention and exact HTTP retry recovery
        run: python verify_request_recovery.py --output local-evidence/request-recovery-ci.json
      - name: Fetch source for earlier HTTP evidence
        uses: actions/checkout@v4
        with:
          ref: fa0da405b5a84acd88834a97adeff2f29f90cc06
          path: prior-http-source
      - name: Fetch source for published runtime evidence
        uses: actions/checkout@v4
        with:
          ref: 6f65a5da4c862c6611af4e471eb3e0f4e4de2f63
          path: runtime-evidence-source
      - name: Fetch source for published runtime restoration evidence
        uses: actions/checkout@v4
        with:
          ref: 3ed2a6fce0a7fc2883789edd57cd919dc5e6b274
          path: runtime-restore-evidence-source
      - name: Fetch source for the unchanged published workload and finance evidence
        uses: actions/checkout@v4
        with:
          ref: ae0fb03000cee395047f1a90e7186950dd6a6b9f
          path: published-evidence-source
      - name: Verify fresh and historical evidence against their own source
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          for filename, root in [
              ('docs/release-2026-11-12.json', Path('historical-source')),
              ('docs/http-2026-11-13.json', Path('prior-http-source')),
              ('docs/release-2026-11-13.json', Path('prior-http-source')),
              ('docs/runtime-security-2026-11-13.json', Path('runtime-evidence-source')),
              ('docs/http-runtime-2026-11-13.json', Path('runtime-evidence-source')),
              ('docs/release-runtime-2026-11-13.json', Path('runtime-evidence-source')),
              ('docs/runtime-restore-2026-11-14.json', Path('runtime-restore-evidence-source')),
              ('local-evidence/release-ci.json', Path('.')),
              ('local-evidence/http-ci.json', Path('.')),
              ('local-evidence/runtime-ci.json', Path('.')),
              ('local-evidence/runtime-restore-ci.json', Path('.')),
              ('local-evidence/multiworker-ci.json', Path('.')),
              ('local-evidence/request-recovery-ci.json', Path('.')),
              ('local-evidence/starter.json', Path('.')),
              ('docs/starter-2026-11-15.json', Path('.')),
              ('docs/request-recovery-2026-11-15.json', Path('.')),
              ('local-evidence/finance-export-ci/report.json', Path('.')),
              ('web/finance-bridge/report.json', Path('published-evidence-source')),
          ]:
              report = json.loads(Path(filename).read_text())
              assert report['checks'] and all(row['passed'] for row in report['checks'])
              for name, expected in report['source_files'].items():
                  assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
          workload = json.loads(Path('web/landmark.json').read_text())
          assert workload['checks'] and all(row['passed'] for row in workload['checks'])
          for name, expected in workload['source_files'].items():
              assert hashlib.sha256((Path('published-evidence-source') / name).read_bytes()).hexdigest() == expected, name
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js && node --check web/sdk.js
      - run: node --test tests/*.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-test-evidence
          path: |
            tests.xml
            local-evidence/http-ci.json
            local-evidence/release-ci.json
            local-evidence/workload-ci.json
            local-evidence/runtime-ci.json
            local-evidence/runtime-restore-ci.json
            local-evidence/multiworker-ci.json
            local-evidence/request-recovery-ci.json
            local-evidence/finance-export-ci/
            local-evidence/starter.json
  compose-first-use:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose and create local-only development credentials
        run: |
          python -m starter.local doctor
          python -m starter.local setup
          python - <<'PY'
          from pathlib import Path
          from starter.local import credentials
          before = Path('.env').read_bytes()
          credentials()
          assert Path('.env').read_bytes() == before
          print('Repeated setup preserved private credential bytes.')
          PY
      - name: Start the documented Compose stack
        run: python -m starter.local up
      - name: Complete and repeat the API journey
        run: |
          python -m starter.client
          python - <<'PY'
          from starter.client import run
          from pathlib import Path
          path = Path('.meterwork/first-use/result.json')
          before = path.read_bytes()
          run()
          assert path.read_bytes() == before
          print('Repeated journey preserved both statement IDs and all export bytes.')
          PY
      - name: Stop and restart with retained data
        run: |
          python -m starter.local stop
          python -m starter.local start
          python -m starter.client
      - name: Produce a private backup and validate the archive
        run: |
          python -m starter.local backup
          python - <<'PY'
          from pathlib import Path
          import subprocess
          backup, = Path('.meterwork/backups').glob('*.dump')
          with backup.open('rb') as source:
              result = subprocess.run(['docker', 'compose', 'exec', '-T', 'postgres', 'pg_restore', '--list'], stdin=source, capture_output=True)
          assert result.returncode == 0
          print('Private PostgreSQL archive is readable; backup bytes are not uploaded.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: starter-compose-result
          path: .meterwork/first-use/result.json
          include-hidden-files: true
      - name: Stop the isolated CI project
        if: always()
        run: docker compose stop
  publish-snapshot:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify, compose-first-use]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for this attempt's artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          endpoint = (f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
                      f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100")
          request = urllib.request.Request(endpoint, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      artifacts = json.load(response)['artifacts']
                  matching = [item for item in artifacts
                              if item['name'] == os.environ['PAGES_ARTIFACT'] and not item['expired']]
                  if len(matching) == 1:
                      print('This attempt has one available Pages artifact.')
                      break
                  if len(matching) > 1:
                      raise SystemExit('Ambiguous Pages artifact; refusing deployment.')
              except urllib.error.HTTPError as error:
                  if error.code not in (429, 500, 502, 503, 504):
                      raise
              except (urllib.error.URLError, TimeoutError):
                  pass
              if attempt == 11:
                  raise SystemExit('Pages artifact metadata did not become available in the bounded window.')
              time.sleep(5)
          PY
      - name: Deploy read-only synthetic snapshot
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
