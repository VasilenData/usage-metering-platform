name: Ledger and product evidence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: meterline_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-disposable-only@localhost:5432/meterline_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --junitxml=tests.xml
      - run: python export_snapshot.py --verify
      - name: Reconcile a fresh multi-account workload
        run: python verify_workload.py --accounts 2 --originals 40 --output local-evidence/workload-ci.json
      - name: Select PostgreSQL 17 backup tools
        run: |
          if [ ! -x /usr/lib/postgresql/17/bin/pg_dump ]; then
            # Ubuntu's stock client may be older than the postgres:17 service.
            # Use PostgreSQL's signed repository and verify its published key.
            curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg.asc"
            test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg.asc" | awk -F: '$1=="fpr" {print $10; exit}')" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo install -m 644 "$RUNNER_TEMP/pgdg.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            . /etc/os-release
            printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y postgresql-client-17
          fi
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Repeat interruption and backup restoration on current source
        run: python verify_release.py --pg-bin /usr/lib/postgresql/17/bin --output local-evidence/release-ci.json
      - name: Fetch immutable pre-fix source for counterexample reproduction
        uses: actions/checkout@v4
        with:
          ref: 94a4cb1885297442ef59bdcf9fcecc605ff2a97b
          path: historical-source
      - name: Exercise real HTTP concurrency and malformed requests
        run: python verify_http.py --baseline-dir historical-source --output local-evidence/http-ci.json
      - name: Exercise restricted runtime and separate request allowances
        run: python verify_runtime.py --output local-evidence/runtime-ci.json
      - name: Verify fresh and historical evidence against their own source
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          for filename, root in [
              ('docs/release-2026-11-12.json', Path('historical-source')),
              ('local-evidence/release-ci.json', Path('.')),
              ('local-evidence/http-ci.json', Path('.')),
              ('local-evidence/runtime-ci.json', Path('.')),
          ]:
              report = json.loads(Path(filename).read_text())
              assert report['checks'] and all(row['passed'] for row in report['checks'])
              for name, expected in report['source_files'].items():
                  assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
          workload = json.loads(Path('web/landmark.json').read_text())
          assert workload['checks'] and all(row['passed'] for row in workload['checks'])
          for name, expected in workload['source_files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js && node --check web/sdk.js
      - run: node --test tests/*.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-test-evidence
          path: |
            tests.xml
            local-evidence/http-ci.json
            local-evidence/release-ci.json
            local-evidence/workload-ci.json
            local-evidence/runtime-ci.json
  publish-snapshot:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for this attempt's artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          endpoint = (f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
                      f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100")
          request = urllib.request.Request(endpoint, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      artifacts = json.load(response)['artifacts']
                  matching = [item for item in artifacts
                              if item['name'] == os.environ['PAGES_ARTIFACT'] and not item['expired']]
                  if len(matching) == 1:
                      print('This attempt has one available Pages artifact.')
                      break
                  if len(matching) > 1:
                      raise SystemExit('Ambiguous Pages artifact; refusing deployment.')
              except urllib.error.HTTPError as error:
                  if error.code not in (429, 500, 502, 503, 504):
                      raise
              except (urllib.error.URLError, TimeoutError):
                  pass
              if attempt == 11:
                  raise SystemExit('Pages artifact metadata did not become available in the bounded window.')
              time.sleep(5)
          PY
      - name: Deploy read-only synthetic snapshot
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
