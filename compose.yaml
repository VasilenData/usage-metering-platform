services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local development password}
      POSTGRES_DB: meterline
    volumes:
      - meterdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meterline"]
      interval: 3s
      retries: 20
  bootstrap:
    build: .
    command: ["python", "bootstrap_runtime.py"]
    environment:
      ADMIN_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/meterline
      METER_RUNTIME_PASSWORD: ${METER_RUNTIME_PASSWORD:?Set a separate URL-safe runtime password of at least 24 characters}
    depends_on:
      postgres:
        condition: service_healthy
  app:
    build: .
    environment:
      METER_RUNTIME_DATABASE_URL: postgresql://meter_api_runtime:${METER_RUNTIME_PASSWORD}@postgres:5432/meterline
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
volumes:
  meterdata:
